[tool.poetry]
name = "task-management-api"
version = "0.1.0"
description = "Secure REST API for managing user-specific todo tasks"
authors = ["Developer <developer@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
sqlmodel = "^0.0.16"
pydantic = "^2.5.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.0.1"
asyncpg = "^0.29.0"  # For PostgreSQL
alembic = "^1.13.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"
mcp = "^1.0.0"
openai = "^1.12.0"
openai-agents = "^0.1.0"
litellm = "^0.50.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
isort = "^5.12.0"
pre-commit = "^3.3.3"
factory-boy = "^3.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true
log-level = "info"