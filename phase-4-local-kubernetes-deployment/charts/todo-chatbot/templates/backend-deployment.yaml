apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-chatbot.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-chatbot.componentLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "todo-chatbot.componentLabels" (dict "ctx" $ "component" "backend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "todo-chatbot.serviceAccountName" . }}
      automountServiceAccountToken: false
      # A chat turn is a long LLM call. The preStop hook withdraws the endpoint
      # from Service rotation before the process begins shutting down, so an
      # in-flight answer is not SIGTERMed mid-stream (FR-013, D8).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          envFrom:
            - configMapRef:
                name: {{ include "todo-chatbot.configMapName" . }}
          env:
            # FR-010 / SC-008 — the fail-fast mechanism, and it needs ZERO
            # application code change. `optional: false` makes the kubelet
            # refuse to create the container when a key is absent, reporting
            # CreateContainerConfigError and naming the missing item.
            # Without it, settings.py defaults database_url to "" and the
            # backend would start happily and fail on first request — exactly
            # SC-008's forbidden 0% case.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
                  optional: false
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: BETTER_AUTH_SECRET
                  optional: false
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: COHERE_API_KEY
                  optional: false
            # readOnlyRootFilesystem otherwise breaks Python the moment it
            # tries to write __pycache__ into the image layer (D7).
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          # /health deliberately does NOT check the database (D8). That is what
          # SC-007 wants: with the database unreachable, pods stay Ready and the
          # frontend shows an error state instead of the whole app collapsing
          # into a restart loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
