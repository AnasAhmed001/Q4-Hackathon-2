{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "todo-chatbot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
# Least privilege here means NO token and NO RBAC objects: neither workload
# touches the Kubernetes API (the backend's agent uses in-process MCP tools and
# a database — see backend-api/src/mcp/ and src/agents/). FR-017 / D7.
automountServiceAccountToken: false
{{- end }}
