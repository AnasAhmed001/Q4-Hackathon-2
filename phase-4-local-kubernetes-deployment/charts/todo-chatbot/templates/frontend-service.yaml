apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "todo-chatbot.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "todo-chatbot.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.containerPort }}
      targetPort: http
      # Read from values, never cluster-assigned (FR-006).
      nodePort: {{ .Values.frontend.nodePort }}
# This Service's ClusterIP resolves as `todo-chatbot-frontend` — exactly the
# host the BACKEND's JWKS fetch depends on (BETTER_AUTH_JWKS_URL, D6). Renaming
# it without updating that value makes every authenticated request 401.
